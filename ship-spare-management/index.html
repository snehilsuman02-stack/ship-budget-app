<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SSMS - Ship Spare Management System" />
    <title>SSMS | Ship Spare Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/forms.css" />
    <link rel="stylesheet" href="./css/tables.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Main Navigation">
        <div class="brand-area">
          <div class="brand-logo" aria-hidden="true">SSMS</div>
          <div>
            <h1 id="brand-title">SHIP SPARE MANAGEMENT SYSTEM</h1>
            <p id="brand-subtitle">Ship Spare Management System</p>
          </div>
        </div>
        <div id="sidebar-nav" class="sidebar-nav"></div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button id="menu-toggle" class="icon-btn" type="button" aria-label="Toggle menu">☰</button>
            <div class="status-pills">
              <span id="connection-badge" class="pill">OFFLINE</span>
              <span id="sync-badge" class="pill">IDLE</span>
            </div>
          </div>

          <div class="topbar-right">
            <div class="global-search-wrap">
              <label class="sr-only" for="global-search">Global Search</label>
              <input id="global-search" type="search" placeholder="Search spares, parts, vendors, transactions..." />
            </div>
            <span id="user-role-badge" class="role-badge">VIEWER</span>
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
            <button id="logout-btn" class="btn btn-secondary" type="button">Logout</button>
          </div>
        </header>

        <main id="app-content" class="content" tabindex="-1" aria-live="polite"></main>
      </div>
    </div>

    <div id="login-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <form id="login-form" class="auth-card">
        <h2 id="login-title">Sign In to SSMS</h2>
        <p class="muted">Use Firebase Authentication credentials.</p>

        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username" required />

        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required />

        <p id="login-error" class="error-text" role="alert"></p>

        <button class="btn btn-primary" type="submit">Sign In</button>
      </form>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>

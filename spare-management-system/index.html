<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spare Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/themes.css" />
  </head>
  <body>
    <div id="login-overlay" class="login-overlay">
      <section class="login-card">
        <h1>Spare Management System</h1>
        <p>Sign in with your Firebase account.</p>
        <form id="login-form">
          <label>
            Username or Email
            <input id="login-email" type="text" required />
          </label>
          <label>
            Password
            <input id="login-password" type="password" required />
          </label>
          <button type="submit">Sign in</button>
        </form>
        <p id="login-error" class="error-text hidden"></p>
      </section>
    </div>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="brand-dot">SM</div>
          <div>
            <h2>Spare Console</h2>
            <p>Operations</p>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <button id="menu-toggle" class="icon-btn" type="button" aria-label="Toggle menu">Menu</button>
          <div class="topbar-right">
            <button id="theme-toggle" class="icon-btn" type="button">Theme</button>
            <span id="user-role-badge" class="role-badge">Guest</span>
            <button id="logout-btn" class="icon-btn" type="button">Logout</button>
          </div>
        </header>

        <main id="app-content" class="content" aria-live="polite"></main>
      </div>
    </div>

    <div id="toast-root" class="toast-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
